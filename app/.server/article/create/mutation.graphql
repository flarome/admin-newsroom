mutation ArticleDetailsCreate($article: ArticleCreateInput!, $blog: ArticleBlogInput) {
  articleCreate(article: $article, blog: $blog) {
    userErrors {
      field
      message
      code
      __typename
    }
    article {
      id

  debug: metafield(key: "fallback_guard", namespace: "debug") {
    value
    __typename
  }

      __typename
    }
    __typename
  }
}
