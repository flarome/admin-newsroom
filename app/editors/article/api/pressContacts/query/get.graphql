query GetMetaobjectEntries($type: String!, $first: Int, $after: String) {
  metaobjectDefinitionByType(type: $type) {
    metaobjectsCount

    metaobjects(first: $first, after: $after) {

      pageInfo {
        startCursor
        endCursor
        hasPreviousPage
        hasNextPage
      }
      
      nodes {
        id
        handle
        fields {
          key
          value
        }
      }
    }
  }
}