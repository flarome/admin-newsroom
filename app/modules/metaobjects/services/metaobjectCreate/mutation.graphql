mutation CreateMetaobject(
  $metaobject: MetaobjectCreateInput!
) {
    metaobjectCreate(metaobject: $metaobject) {
    metaobject {
      id
      handle
          displayName
      fields {
        key
        value
      }
      updatedAt

      definition {
        description
        displayNameKey
        id
        metaobjectsCount
        name
        type
        fieldDefinitions {
          description
          key
          name
          required
          validations {
            name
            type
            value
          }
          type {
            category
            name
            valueType
            supportedValidations {
              name
              type
            }
          }
        }
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}
